services:
  postgres:
    image: postgres:16-alpine
    container_name: agrimanage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agrimanage
    ports:
      - "5433:5432"
    volumes:
      - agrimanage_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrimanage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agrimanage_pg:
